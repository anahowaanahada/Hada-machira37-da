
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#a30d18">
<title>WormGPT — صيانة مؤقتة</title>

<style>
:root {
  --red: #d7192d;
  --bg: #09090b;
  --muted: #a1a1aa;
}

* {
  box-sizing: border-box;
}

html, body {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px 18px;
  background:
    radial-gradient(
      ellipse at 50% 12%,
      rgba(183,16,34,.22),
      transparent 42%
    ),
    radial-gradient(
      ellipse at 50% 100%,
      rgba(107,10,20,.12),
      transparent 48%
    ),
    var(--bg);
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Tahoma, Arial, sans-serif;
}

.page {
  width: min(100%, 620px);
  text-align: center;
  padding: 54px 34px 38px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 24px;
  background: linear-gradient(
    160deg,
    rgba(255,255,255,.045),
    rgba(255,255,255,.012)
  );
  box-shadow:
    0 28px 90px rgba(0,0,0,.48),
    0 0 70px rgba(190,16,35,.08);
  animation: appear .7s ease both;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 46px;
  direction: ltr;
  font-size: 17px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.brand-mark {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: white;
  background: linear-gradient(145deg,#f04452,#9e0716);
  box-shadow: 0 5px 22px rgba(215,25,45,.28);
  font-size: 17px;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 13px;
  border: 1px solid rgba(239,68,68,.22);
  border-radius: 999px;
  background: rgba(185,28,42,.09);
  color: #ff8b94;
  font-size: 12px;
  font-weight: 650;
  margin-bottom: 24px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ef4444;
  box-shadow: 0 0 12px rgba(239,68,68,.8);
  animation: pulse 1.8s infinite;
}

h1 {
  margin: 0 0 17px;
  font-size: clamp(32px,7vw,46px);
  line-height: 1.25;
  letter-spacing: -.8px;
  font-weight: 800;
}

h1 span {
  color: #ed3345;
}

.lead {
  max-width: 440px;
  margin: 0 auto;
  color: #c4c4cc;
  font-size: 16px;
  line-height: 2;
}

.divider {
  width: 54px;
  height: 2px;
  margin: 31px auto 25px;
  border-radius: 5px;
  background: linear-gradient(
    90deg,
    transparent,
    #e3263b,
    transparent
  );
}

.note {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.9;
}

.footer {
  margin-top: 44px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,.09);
  color: #71717a;
  font-size: 11px;
  letter-spacing: .15px;
}

@keyframes pulse {
  50% {
    opacity: .45;
    transform: scale(.82);
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 480px) {
  .page {
    padding: 42px 22px 28px;
    border-radius: 19px;
  }

  .brand {
    margin-bottom: 39px;
  }

  .lead {
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
  }
}
</style>
</head>

<body>

<main class="page">

  <div class="brand" aria-label="WormGPT">
    <span class="brand-mark">W</span>
    <span>WormGPT</span>
  </div>

  <div class="status">
    <span class="dot"></span>
    صيانة مؤقتة
  </div>

  <h1>
    أوبس!
    <span>نعتذر عن الإزعاج.</span>
  </h1>

  <p class="lead">
    الموقع متوقف حالياً بشكل مؤقت، حيث نعمل على
    تنفيذ بعض الإصلاحات والتحسينات لضمان عودته
    بأفضل صورة ممكنة.
  </p>

  <div class="divider"></div>

  <p class="note">
    نعمل على إعادة تشغيل الخدمة في أقرب وقت.<br>
    سنوافيكم بالمستجدات فور اكتمال أعمال الصيانة.
  </p>

  <div class="footer">
    شكراً لثقتكم وصبركم وتفهمكم.
  </div>

</main>

</body>
</html>
