<!DOCTYPE html>
<html lang="en" dir="ltr" data-cg-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WormGPT — v1.0 Public</title>
<style>
/* ===== WormGPT — Red Theme ===== */
:root{
  --cg-red:#CC0000;
  --cg-red-dark:#990000;
  --cg-red-soft:rgba(204,0,0,.15);
  --font:-apple-system,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --motion:1; --compact:0; --fade-duration:.25s; --spin-duration:.8s; --pulse-duration:1.4s;
  --radius:16px;
  /* Dark Red Theme */
  --bg:#161616;
  --bg-secondary:#1f1f1f;
  --surface:#282828;
  --text:#ececf1;
  --text-secondary:#b4b4be;
  --text-tertiary:#6e6e78;
  --border:#3a2424;
  --bubble-user:#3a1414;
  --code-bg:#1a1a1a;
  --sidebar-bg:#101010;
  --sidebar-text:#ececf1;
  --sidebar-dim:#8e8ea0;
  --sidebar-hover:#CC000022;
  --composer-bg:#1f1f1f;
  --shadow:0 4px 24px rgba(204,0,0,.15);
  --backdrop:rgba(0,0,0,.75);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:rgba(204,0,0,.3)}
svg{display:block}
.ic{width:20px;height:20px;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== App layout ===== */
.app{display:flex;height:100dvh}
/* Sidebar */
.sidebar{width:260px;flex:none;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;z-index:40;transition:transform .25s ease}
.sidebar-top{padding:10px 8px 4px;display:flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:inherit;transition:background .15s;flex:none}
.icon-btn:hover{background:var(--sidebar-hover)}
.wordmark{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;padding:4px 6px;user-select:none}
.cg-logo{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 32px;background:transparent;border:0;border-radius:0;padding:0;margin:0;vertical-align:middle}.cg-logo svg{width:32px;height:32px;display:block;flex:0 0 32px;background:transparent;border:0;border-radius:0;padding:0;margin:0}
.nav{display:flex;flex-direction:column;gap:1px;padding:6px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-size:14px;color:var(--sidebar-text);text-align:start;width:100%;transition:background .15s}
.nav-item:hover{background:var(--sidebar-hover)}
.nav-item svg{width:17px;height:17px;color:var(--sidebar-dim);flex:none}
.nav-item.primary{border:1px solid #CC000044}
.recents{flex:1;overflow-y:auto;padding:8px}
.recents-label{font-size:11px;color:var(--sidebar-dim);padding:8px 11px 4px;font-weight:600}
.recent-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 11px;border-radius:8px;font-size:13.5px;color:var(--sidebar-text);text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-item:hover{background:var(--sidebar-hover)}
.recent-item svg{width:15px;height:15px;color:var(--sidebar-dim);flex:none}
.sidebar-footer{padding:8px;border-top:1px solid #CC000022}
.user-chip{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:8px;text-align:start}
.user-chip:hover{background:var(--sidebar-hover)}
.user-chip b{font-size:13.5px;display:block}
.user-chip small{font-size:11.5px;color:var(--sidebar-dim)}
/* Main column */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.header{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid #3a2424;position:relative;z-index:30}
.header .menu-btn{display:none}
.header-brand{display:flex;align-items:center;gap:7px;height:40px;font-size:16.5px;font-weight:600;color:var(--text);white-space:nowrap}
.header-brand .cg-logo{width:32px;height:32px;flex:0 0 32px}
.header-brand .cg-logo svg{width:32px;height:32px;flex:0 0 32px}
.model-btn{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;font-size:16.5px;font-weight:600;color:var(--text)}
.model-btn:hover{background:var(--bg-secondary)}
.model-btn .chev{width:15px;height:15px;color:var(--text-tertiary)}
.header-spacer{flex:1}
.share-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid #3a2424;font-size:13px;transition:background .15s;color:var(--text-secondary)}
.share-btn:hover{background:var(--bg-secondary)}
.share-btn svg{width:14px;height:14px}
/* Model dropdown / generic menu */
.menu{position:fixed;background:var(--surface);border:1px solid #3a2424;border-radius:12px;box-shadow:var(--shadow);padding:5px;min-width:230px;z-index:80;display:none}
.menu.open{display:block}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:8px;font-size:13.5px;text-align:start;color:var(--text)}
.menu-item:hover{background:var(--bg-secondary)}
.menu-item.active{color:var(--cg-red);font-weight:600}
.menu-sep{height:1px;background:#3a2424;margin:5px 8px}
.menu-label{font-size:11px;color:var(--text-tertiary);padding:6px 11px 3px;font-weight:600}
/* Thread */
.thread{flex:1;overflow-y:auto;padding:var(--thread-pad,20px) 0}
.content,.msg.user .bubble,.composer textarea{font-size:var(--message-font-size,15.5px)}
.thread-inner{max-width:768px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:var(--thread-gap,24px)}
.msg{display:flex;gap:14px;animation:fadein var(--fade-duration,.25s) ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--bubble-user);border:1px solid #4a2424;border-radius:18px;padding:10px 16px;max-width:78%;font-size:15.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--text)}
[dir="rtl"] .msg.user{justify-content:flex-start}
.avatar{width:32px;height:32px;border-radius:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:0 0 32px;margin-top:2px;padding:0;border:0}
.avatar svg{width:32px;height:32px;display:block;flex:0 0 32px;background:transparent;border:0;border-radius:0;padding:0;margin:0}
.msg .body{min-width:0;max-width:100%;flex:1}
.content{font-size:15.5px;line-height:1.7;word-break:break-word;color:var(--text)}
.content p{margin:0 0 10px}.content p:last-child{margin-bottom:0}
.content h2,.content h3,.content h4{margin:16px 0 8px;line-height:1.35;color:var(--text)}
.content ul{margin:8px 0 12px;padding-inline-start:22px}.content li{margin:4px 0}
.content a{color:var(--cg-red)}
.inline-code{font-family:var(--mono);font-size:.86em;background:var(--bg-secondary);border:1px solid #3a2424;border-radius:5px;padding:1px 5px;color:var(--text-secondary)}
/* thinking / search states */
.thinking{display:flex;align-items:center;gap:9px;color:var(--text-secondary);font-size:14px;padding:4px 0}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid #3a2424;border-top-color:var(--cg-red);animation:spin var(--spin-duration,.8s) linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.think-details{font-size:12.5px;color:var(--text-tertiary);padding:4px 0 0 24px}
.search-state b{font-size:14px;color:var(--text-secondary)}
.source-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.source{font-size:12px;border:1px solid #3a2424;border-radius:99px;padding:4px 11px;color:var(--text-secondary);transition:all .3s}
.source.done{background:var(--cg-red-soft);border-color:var(--cg-red);color:var(--cg-red)}
/* action bar */
.actions{display:flex;gap:3px;margin-top:10px;opacity:.85}
.action{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-secondary)}
.action:hover{background:var(--bg-secondary);color:var(--text)}
.action.active{color:var(--cg-red);background:var(--cg-red-soft)}
.action svg{width:16px;height:16px}
/* code block */
.codeblock{position:relative;border:1px solid #4a2828;border-radius:16px;overflow:hidden;margin:14px 0;background:linear-gradient(180deg,#1a1212 0%,var(--code-bg) 42%);box-shadow:0 0 0 1px rgba(204,0,0,.08),0 14px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04)}
.codeblock::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,#CC000088,transparent);pointer-events:none}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 14px;background:linear-gradient(180deg,#221616,#171010);border-bottom:1px solid #3a2424}
.code-left{display:flex;align-items:center;gap:10px;min-width:0}
.code-traffic{display:flex;gap:6px}
.code-traffic i{width:10px;height:10px;border-radius:50%;display:block;opacity:.9}
.code-traffic i:nth-child(1){background:#ff5f57}
.code-traffic i:nth-child(2){background:#febc2e}
.code-traffic i:nth-child(3){background:#28c840}
.code-lang{font-family:var(--mono);font-size:12px;color:#d0d0dc;background:rgba(204,0,0,.14);border:1px solid #CC000044;padding:3px 9px;border-radius:999px;text-transform:lowercase}
.code-actions{display:flex;gap:6px;flex-wrap:wrap}
.code-actions button{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#cfcfd8;padding:6px 10px;border-radius:9px;border:1px solid #3a2424;background:transparent;transition:background .15s,border-color .15s,color .15s}
.code-actions button:hover{background:rgba(204,0,0,.12);border-color:#CC000066;color:#fff}
.code-actions svg{width:13px;height:13px}
.codeblock pre{padding:16px 18px 18px;overflow:auto;max-height:min(60vh,520px);font-family:var(--mono);font-size:13.2px;line-height:1.7;color:#e6e6ef;background:transparent;scrollbar-width:thin;scrollbar-color:#4a3030 transparent}
.codeblock pre.wrap{white-space:pre-wrap;word-break:break-word}
.codeblock pre::-webkit-scrollbar{height:8px;width:8px}
.codeblock pre::-webkit-scrollbar-thumb{background:#4a3030;border-radius:8px}
.code .kw{color:#ff7a93}.code .str{color:#a8e07f}.code .comment{color:#6b6b7d;font-style:italic}.code .fn{color:#82aaff}.code .num{color:#f7b56b}.code .op{color:#ff9b6a}
/* Composer */
.composer-wrap{flex:none;padding:8px 20px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.composer{width:100%;max-width:768px;background:var(--composer-bg);border:1px solid #3a2424;border-radius:28px;box-shadow:var(--shadow);padding:8px 8px 8px 6px;position:relative;transition:border-color .15s}
.composer:focus-within{border-color:#CC000066}
.composer-row{display:flex;align-items:flex-end;gap:4px}
.composer textarea{flex:1;border:0;outline:0;background:none;resize:none;max-height:220px;padding:9px 8px;font-size:15.5px;line-height:1.5;color:var(--text)}
.composer textarea::placeholder{color:var(--text-tertiary)}
.round-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;transition:background .15s}
.round-btn:hover{background:var(--bg-secondary)}
.round-btn svg{width:20px;height:20px}
.send-btn{background:var(--cg-red);color:#fff}
.send-btn:hover:not(:disabled){background:var(--cg-red-dark)}
.send-btn:disabled{background:var(--text-tertiary);opacity:.45;cursor:not-allowed}
.send-btn svg{width:17px;height:17px}
.mic-btn.listening{background:var(--cg-red-soft);color:var(--cg-red);animation:pulse var(--pulse-duration,1.4s) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(204,0,0,.14)}}
.composer-hint{text-align:center;font-size:11px;color:var(--text-tertiary);padding-top:9px;user-select:none}
/* chips (files / mode) */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--bg-secondary);border:1px solid #3a2424;border-radius:99px;padding:4px 11px;color:var(--text-secondary)}
.mode-chip{color:var(--cg-red);background:var(--cg-red-soft);border-color:transparent;font-weight:600}
/* overlays */
.backdrop{position:fixed;inset:0;background:var(--backdrop);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.backdrop.open{opacity:1;pointer-events:auto}
/* settings panel */
.settings{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100vw);background:var(--surface);z-index:70;transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
[dir="rtl"] .settings{transform:translateX(-105%)}
.settings.open{transform:translateX(0)}
.settings-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #3a2424;flex:none}
.settings-head h2{font-size:16.5px;flex:1;color:var(--text)}
.settings-body{flex:1;overflow-y:auto}
.set-nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;flex:none;border-bottom:1px solid #3a2424;scrollbar-width:none}
.set-nav button{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid #3a2424;color:var(--text-secondary)}
.set-nav button svg{width:13px;height:13px}
.set-nav button.active{background:var(--cg-red);border-color:var(--cg-red);color:#fff}
.set-sec{display:none;padding:18px 20px 30px}
.set-sec.active{display:block}
.set-sec>p{font-size:12.5px;color:var(--text-tertiary);margin:4px 0 16px}
.set-sec h3{font-size:17px;color:var(--text)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid #3a2424}.set-label{min-width:0;flex:1}.set-row .setting-static{flex:0 0 auto}.range-control{display:flex;align-items:center;gap:10px;flex:none}.range-control output{font-size:12px;color:var(--text-secondary);min-width:24px;text-align:end}
.set-row strong{font-size:13.5px;display:block;color:var(--text)}
.set-label span{font-size:12px;color:var(--text-tertiary);display:block;margin-top:2px;max-width:260px;line-height:1.5}
/* toggle */
.toggle{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.toggle input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2}
.toggle i{position:absolute;inset:0;border-radius:99px;background:var(--text-tertiary);opacity:.45;transition:.2s}
.toggle i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.toggle input:checked+i{background:var(--cg-red);opacity:1}
.toggle input:checked+i::after{transform:translateX(18px)}
[dir="rtl"] .toggle input:checked+i::after{transform:translateX(-18px)}
.select{background:var(--bg-secondary);border:1px solid #3a2424;border-radius:9px;padding:7px 10px;font-size:13px;max-width:190px;color:var(--text)}
.text-input{background:var(--bg-secondary);border:1px solid #3a2424;border-radius:9px;padding:8px 11px;font-size:13px;min-width:200px;color:var(--text)}

textarea.text-input{resize:vertical;min-width:min(300px,55vw)}
.set-row-custom{display:flex;flex-direction:column;align-items:stretch;gap:10px}
.set-row-custom .set-label{width:100%;flex:none}
.set-row-custom .set-label span{max-width:none}
.set-row-custom textarea.custom-instructions{display:block;width:100%;max-width:100%;min-width:0;min-height:150px;box-sizing:border-box;line-height:1.65;padding:13px 14px;border-radius:12px;background:var(--bg-secondary);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;transition:border-color .18s,box-shadow .18s}
.set-row-custom textarea.custom-instructions:focus{border-color:var(--cg-red);box-shadow:0 0 0 3px color-mix(in srgb,var(--cg-red) 16%,transparent)}
.clear-warning{padding:18px 20px 20px}
.clear-warning .warning-mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#ff6b5f;background:rgba(220,45,35,.13);border:1px solid rgba(220,45,35,.35);margin-bottom:13px}
.clear-warning .warning-mark svg{width:25px;height:25px}
.clear-warning h3{font-size:17px;color:var(--text);margin:0 0 9px}
.clear-warning p{font-size:13px;line-height:1.7;color:var(--text-secondary);margin:0 0 12px}
.clear-warning ul{margin:0 0 18px;padding-inline-start:20px;color:var(--text-secondary);font-size:12.5px;line-height:1.9}
.clear-warning .warning-note{padding:10px 12px;border-radius:10px;background:rgba(220,45,35,.09);border:1px solid rgba(220,45,35,.24);color:var(--text);font-size:12px;line-height:1.6;margin-bottom:18px}
.clear-warning .warning-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.clear-warning .warning-actions button{min-height:42px;padding:9px 15px;border-radius:10px;font-size:13px}
.clear-warning .cancel-clear{border:1px solid var(--border);background:var(--bg-secondary);color:var(--text)}
.clear-warning .confirm-clear{border:1px solid #b42318;background:#b42318;color:#fff;font-weight:650}
.clear-warning .confirm-clear:hover{background:#921d15}
@media(max-width:560px){.set-sec{padding-inline:15px}.set-row-custom textarea.custom-instructions{min-height:170px;font-size:14px}.clear-warning{padding:16px}.clear-warning .warning-actions{flex-direction:column-reverse}.clear-warning .warning-actions button{width:100%}}

input[type=color].text-input{min-width:52px;width:52px;height:34px;padding:3px;cursor:pointer}
input[type=range]{accent-color:var(--cg-red);width:170px}
.btn{border:1px solid #3a2424;background:var(--surface);border-radius:9px;padding:8px 14px;font-size:13px;color:var(--text)}
.btn:hover{background:var(--bg-secondary)}
.btn.danger{color:var(--cg-red);border-color:var(--cg-red)}
/* modals */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-bg{position:absolute;inset:0;background:var(--backdrop)}
.dialog{position:relative;background:var(--surface);border:1px solid #3a2424;border-radius:16px;box-shadow:var(--shadow);width:min(480px,100%);max-height:88dvh;display:flex;flex-direction:column;overflow:hidden}
.dialog-head{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid #3a2424}
.dialog-head h3{font-size:15.5px;flex:1;color:var(--text)}
.dialog-body{padding:16px 18px;overflow-y:auto;font-size:13.5px;color:var(--text-secondary)}
.dialog.wide{width:min(860px,100%)}
.run-frame{width:100%;height:340px;border:0;background:#161616;border-radius:10px}
.play-tabs{display:flex;gap:4px;padding:10px 18px 0}
.play-tabs button{font-size:12.5px;padding:6px 13px;border-radius:8px;color:var(--text-secondary)}
.play-tabs button.active{background:var(--bg-secondary);color:var(--text);font-weight:600}
.console{font-family:var(--mono);font-size:12px;background:var(--code-bg);color:#c9e79a;border-radius:10px;padding:12px 14px;height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.console .err{color:#ff8a8a}
.search-input{width:100%;background:var(--bg-secondary);border:1px solid #3a2424;border-radius:10px;padding:10px 14px;font-size:14px;outline:0;color:var(--text)}
.search-results{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.search-results button{display:flex;gap:9px;align-items:center;text-align:start;padding:9px 11px;border-radius:8px;font-size:13px;width:100%;color:var(--text)}
.search-results button:hover{background:var(--bg-secondary)}
/* toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:120;background:var(--surface);color:var(--text);border:1px solid #3a2424;box-shadow:var(--shadow);padding:9px 16px;border-radius:99px;font-size:12.5px;animation:fadein .2s ease;max-width:92vw;text-align:center}
/* responsive */
@media (max-width:860px){
  .sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;transform:translateX(-105%)}
  [dir="rtl"] .sidebar{transform:translateX(105%)}
  .sidebar.open{transform:translateX(0)}
  .header .menu-btn{display:grid}
  .thread-inner{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){:root{--motion:0}}
html[data-cg-motion="0"]{--motion:0}
html[data-cg-compact="1"]{--compact:1}

/* ===== Responsive refinement ===== */
.header{gap:8px;padding-inline:clamp(10px,2vw,22px);min-height:60px;height:auto}
.header-brand{gap:8px;min-width:0}
.model-btn{padding:8px 10px;border:1px solid transparent;border-radius:11px;font-size:15px}
.model-btn:hover{border-color:var(--border)}

function cloneMessages(messages){return JSON.parse(JSON.stringify(messages||[]))}
function saveActiveChat(){
  // Never create or persist an empty placeholder session.
  if(!state.messages.length)return;
  if(state.settings.privacyMode||!state.settings.saveHistory)return;
  if(!state.activeChatId)state.activeChatId=uid();
  const first=state.messages.find(m=>m.role==="user");
  const raw=(first?.content||"").trim();
  const title=raw?raw.replace(/\s+/g," ").slice(0,48):"Attachment";
  const snapshot=cloneMessages(state.messages);
  const all=state.chats.filter(c=>c.id!==state.activeChatId);
  all.unshift({id:state.activeChatId,title,messages:snapshot,updated:Date.now()});
  state.chats=all.slice(0,100);
  store.set("wormgpt-sessions",state.chats);
  store.set("wormgpt-active-chat",state.activeChatId);
  // Legacy key caused old and new conversations to be merged on reload. Retire it.
  try{localStorage.removeItem("wormgpt-messages")}catch{}
}
function newChat(){
  saveActiveChat();
  state.activeChatId=uid();
  state.messages=[];
  if(!state.settings.privacyMode&&state.settings.saveHistory)store.set("wormgpt-active-chat",state.activeChatId);
  clearComposer();
  threadInner.innerHTML="";
  state.mode="normal";
  renderChips();
  renderRecents();
  closeMenus();
}
function openChat(id){
  // Save only the conversation currently on screen, then load a detached copy.
  saveActiveChat();
  const chat=state.chats.find(c=>c.id===id);
  if(!chat)return;
  state.activeChatId=chat.id;
  state.messages=cloneMessages(chat.messages);
  if(!state.settings.privacyMode&&state.settings.saveHistory)store.set("wormgpt-active-chat",id);
  clearComposer();
  renderMessages();
  renderRecents();
  closeSidebar();
}

  $$("[data-chat]",r).forEach(b=>b.onclick=()=>openChat(b.dataset.chat));
}

/* markdown */
function mdToHtml(src){
  let s=esc(src||"");const blocks=[];
  s=s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(mm,lang,code)=>{const i=blocks.push({lang:(lang||"text").toLowerCase(),code})-1;return "\u0000CB"+i+"\u0000"});
  s=s.replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`([^`\n]+)`/g,'<span class="inline-code">$1</span>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/^\s*[-*] (.+)$/gm,"<li>$1</li>").replace(/((?:<li>.*<\/li>\n?)+)/g,"<ul>$1</ul>");
  s=s.replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");
  s="<p>"+s+"</p>";
  blocks.forEach((b,i)=>{s=s.replace("\u0000CB"+i+"\u0000",
    `<div class="codeblock"><div class="code-head"><div class="code-left"><span class="code-traffic" aria-hidden="true"><i></i><i></i><i></i></span><span class="code-lang">${esc(b.lang)}</span></div><span class="code-actions">
      <button data-copy="${i}">${I.copy} Copy</button><button data-run="${i}">${I.play} Run</button><button data-expand>${I.expand}</button>
    </span></div><pre class="code${state.settings.codeWrap?" wrap":""}">${highlight(b.code,b.lang)}</pre></div>`)});
  s=s.replace(/<p>(\s*(?:<div class="codeblock">|<ul>|<h[234]>))/g,"$1").replace(/(<\/div>|<\/ul>|<\/h[234]>)\s*<\/p>/g,"$1");
  return s;
}
function highlight(code){
  let x=esc(code);
  x=x.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)/g,'<span class="comment">$1</span>');
  x=x.replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g,'<span class="str">$1</span>');
  x=x.replace(/\b(const|let|var|function|return|if|else|for|while|class|import|from|export|default|def|print|async|await|new|try|catch|public|private|void|int|include|using|elif|lambda|None|True|False|true|false|null)\b/g,'<span class="kw">$1</span>');
  x=x.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>');
  return x;
}

function target(id){return $("#"+CSS.escape(id)+" .content")}
async function runAssistant(id,prompt,files){
  const el=target(id),s=state.settings;
  const payload={message:prompt,mode:state.mode,model:s.model,temperature:Number(s.temperature),systemPrompt:String(s.systemPrompt||"").trim()};
  // Send recent turns so the backend can preserve conversational context.
  // The current user message is already sent separately as `message`.
  payload.history=state.messages
    .filter(m=>m.id!==id&&(m.role==="user"||m.role==="assistant")&&typeof m.content==="string"&&m.content.trim())
    .slice(0,-1).slice(-16).map(m=>({role:m.role,content:m.content}));
  const buildFormData=()=>{
    const fd=new FormData();
    fd.append("message",payload.message);fd.append("mode",payload.mode);fd.append("model",payload.model);
    fd.append("temperature",String(payload.temperature));fd.append("systemPrompt",payload.systemPrompt);
    fd.append("history",JSON.stringify(payload.history));
    files.forEach(f=>fd.append("files",f,f.name));
    return fd;
  };
  const base=CONFIG.CHAT_ENDPOINT.replace(/\/$/,"");
  const useStream=!!s.streaming;
  try{
    if(useStream){
      try{
        const r=await fetch(base+"/stream",{method:"POST",body:buildFormData(),headers:{"Accept":"text/event-stream"}});
        if(!r.ok){let detail="Backend returned HTTP "+r.status;try{const d=await r.json();detail=d.error||detail}catch{}throw new Error(detail)}
        if(!r.body)throw new Error("Streaming response is not supported by this browser");
        const reader=r.body.getReader(),decoder=new TextDecoder();let buffer="",answer="";
        const handleEvent=raw=>{
          let event="message",data="";
          for(const line of raw.split(/\r?\n/)){
            if(line.startsWith("event:"))event=line.slice(6).trim();
            else if(line.startsWith("data:"))data+=line.slice(5).trim();
          }
          if(!data)return;
          let item={};try{item=JSON.parse(data)}catch{return}
          if(event==="status"){
            const labels={thinking:"Thinking",search:"Searching the web",agent:"Agents working",planning:"Planning",analysis:"Analyzing",review:"Reviewing results",generating:"Generating response"};
            const label=item.label||labels[item.stage]||"Working";
            if(el)el.innerHTML=`<div class="thinking"><span class="spinner"></span><span>${esc(label)}</span></div>`;
          }else if(event==="delta"){
            if(typeof item.text==="string")answer+=item.text;
          }else if(event==="error"){
            throw new Error(item.error||"Backend task failed");
          }
        };
        while(true){
          const {value,done}=await reader.read();
          if(done)break;
          buffer+=decoder.decode(value,{stream:true});
          const chunks=buffer.split(/\r?\n\r?\n/);buffer=chunks.pop()||"";
          for(const chunk of chunks)handleEvent(chunk);
        }
        buffer+=decoder.decode();if(buffer.trim())handleEvent(buffer);
        if(!answer.trim())throw new Error("Backend completed without returning an answer");
        return await stream(id,answer);
      }catch(streamErr){
        console.warn("WormGPT stream failed, falling back to /api/chat:",streamErr);
        // fall through to JSON path
      }
    }
    // JSON path: POST /api/chat (also used when streaming is off or stream fails)
    if(el)el.innerHTML=`<div class="thinking"><span class="spinner"></span><span>${esc(t("preparing")||"Working")}</span></div>`;
    const r=await fetch(base,{method:"POST",body:buildFormData(),headers:{"Accept":"application/json"}});
    if(!r.ok){let detail="Backend returned HTTP "+r.status;try{const d=await r.json();detail=d.error||detail}catch{}throw new Error(detail)}
    const data=await r.json();
    const answer=(data.reply||data.response||"").trim();
    if(!answer)throw new Error(data.error||"Backend completed without returning an answer");
    // Optional search sources as a clean footer
    let finalText=answer;
    if(Array.isArray(data.sources)&&data.sources.length){
      const lines=data.sources.slice(0,8).map((s,i)=>`${i+1}. ${s.title||"Source"}${s.url?" — "+s.url:""}`).join("\n");
      finalText+="\n\n---\nSources:\n"+lines;
    }
    return await stream(id,finalText);
  }catch(err){
    const detail=location.protocol==="file:"?
      "This HTML is opened directly from a device. A real AI response needs this page hosted with its backend, or a configured same-origin /api/chat service.":
      "The AI backend could not complete the request: "+(err?.message||"Unknown error");
    finish(id,"**Backend not connected**\n\n"+detail+"\n\nYour conversation is still saved locally. This interface will not invent a demo answer.");
    console.warn("WormGPT backend:",err);
  }
}

async function exportConversationTxt(){
  saveActiveChat();
  const chat=state.chats.find(c=>c.id===state.activeChatId);
  const messages=chat?.messages||state.messages;
  if(!messages.length){toast("This conversation is empty");return}
  const title=chat?.title||"WormGPT conversation";
  const lines=[title,"Exported: "+new Date().toLocaleString(),"=".repeat(38),
    ...messages.map(m=>(m.role==="user"?"YOU":"WORMGPT")+"\\n"+(m.content||"[Attachment]")+
      (m.files?.length?"\\nAttachments: "+m.files.join(", "):""))];
  const blob=new Blob([lines.join("\\n\\n")],{type:"text/plain;charset=utf-8"});
  const filename="WormGPT-"+title.replace(/[^a-z0-9-_]+/gi,"-").slice(0,32)+"-"+new Date().toISOString().slice(0,10)+".txt";
  // iPhone/iPad: native share sheet exposes Save to Files when supported.
  try{
    const file=new File([blob],filename,{type:"text/plain"});
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
      await navigator.share({files:[file],title:"Export WormGPT conversation"});
      toast("Choose Save to Files to keep the TXT on your iPhone");
      return;
    }
  }catch(err){if(err?.name==="AbortError")return;console.warn("Native file share unavailable",err)}
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast("TXT export started");
}

  openModal(`<div class="dialog-head"><h3>${esc(copy.title)}</h3><button class="icon-btn" type="button" data-close-modal aria-label="${esc(copy.no)}">${I.close}</button></div><div class="clear-warning"><div class="warning-mark">${warningIcon}</div><h3>${esc(copy.lead)}</h3><p>${esc(copy.body)}</p><ul>${copy.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="warning-note">${esc(copy.note)}</div><div class="warning-actions"><button type="button" class="cancel-clear" data-close-modal>${esc(copy.no)}</button><button type="button" class="confirm-clear" id="confirm-clear-all">${esc(copy.yes)}</button></div></div>`);
  $("#confirm-clear-all").onclick=()=>{
    try{
      const keys=[];
      for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.toLowerCase().startsWith("wormgpt-"))keys.push(key)}
      keys.forEach(key=>localStorage.removeItem(key));
      localStorage.removeItem("wormgpt-messages");
    }catch(err){console.warn("WormGPT local data cleanup:",err)}
    state.messages=[];state.chats=[];state.activeChatId=null;state.files=[];state.mode="normal";
    state.settings=Object.assign({},DEFAULT);
    closeModal();applySettings(false);renderMessages();renderRecents();updateSend();
    if($("#settings").classList.contains("open")){settingsActiveSection="general";renderSettings()}
    toast(copy.done);
  };
 }
 if(a==="__export")exportConversationTxt();
 if(a==="__reset"){state.settings=Object.assign({},DEFAULT);applySettings(true);renderSettings()}
}
function showSettingsPanel(ev){if(ev){ev.preventDefault();ev.stopPropagation()}const panel=$("#settings");closeSidebar();closeMenus();panel.classList.add("open");backdrop.classList.add("open");try{renderSettings()}catch(err){console.error("Settings render failed:",err);$("#set-body").innerHTML='<div style="padding:20px;color:var(--text)">Settings could not be fully rendered. Please reload and try again.</div>'}}
$("#open-settings").addEventListener("click",showSettingsPanel);
$("#settings-back").addEventListener("click",()=>{const p=$("#settings");p.classList.remove("open");p.style.pointerEvents="";p.style.transform="";p.style.zIndex="";p.style.visibility="";if(!sidebar.classList.contains("open"))backdrop.classList.remove("open")});
/* ================= Init ================= */
// One-time migration from the old single-history store. Once sessions exist, legacy
// history is ignored and deleted so it can never leak into a newly-created chat.
if(!state.chats.length){
  let legacy=[];
  if(state.settings.privacyMode||!state.settings.saveHistory){try{localStorage.removeItem("wormgpt-messages")}catch{} } else {try{legacy=JSON.parse(localStorage.getItem("wormgpt-messages")||"[]")}catch{}
  if(Array.isArray(legacy)&&legacy.length){
    state.activeChatId=uid();state.messages=cloneMessages(legacy);saveActiveChat();
  }else{
    state.messages=[];state.activeChatId=uid();
    try{localStorage.removeItem("wormgpt-messages")}catch{}
  }
  }
}else{
  const active=state.chats.find(c=>c.id===state.activeChatId)||state.chats[0];
  state.activeChatId=active.id;state.messages=cloneMessages(active.messages);
  store.set("wormgpt-active-chat",state.activeChatId);
  try{localStorage.removeItem("wormgpt-messages")}catch{}
}
applySettings(true);renderRecents();renderMessages();updateSend();
$("#prompt").focus();
window.WormGPT={state,sendMessage,applySettings,version:"1.4.0"};
</script>
