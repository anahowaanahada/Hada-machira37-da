/* ===== WormGPT — Red Theme ===== */
:root{
  --cg-red:#CC0000;
  --cg-red-dark:#990000;
  --cg-red-soft:rgba(204,0,0,.15);
  --font:-apple-system,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --motion:1; --compact:0; --fade-duration:.25s; --spin-duration:.8s; --pulse-duration:1.4s;
  --radius:16px;
  /* Dark Red Theme */
  --bg:#161616;
  --bg-secondary:#1f1f1f;
  --surface:#282828;
  --text:#ececf1;
  --text-secondary:#b4b4be;
  --text-tertiary:#6e6e78;
  --border:#3a2424;
  --bubble-user:#3a1414;
  --code-bg:#1a1a1a;
  --sidebar-bg:#101010;
  --sidebar-text:#ececf1;
  --sidebar-dim:#8e8ea0;
  --sidebar-hover:#CC000022;
  --composer-bg:#1f1f1f;
  --shadow:0 4px 24px rgba(204,0,0,.15);
  --backdrop:rgba(0,0,0,.75);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:rgba(204,0,0,.3)}
svg{display:block}
.ic{width:20px;height:20px;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== App layout ===== */
.app{display:flex;height:100vh;height:100dvh}
/* Sidebar */
.sidebar{width:260px;flex:none;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;z-index:40;transition:transform .25s ease}
.sidebar-top{padding:10px 8px 4px;display:flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:inherit;transition:background .15s;flex:none}
.icon-btn:hover{background:var(--sidebar-hover)}
.wordmark{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;padding:4px 6px;user-select:none}
.cg-logo{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 32px;background:transparent;border:0;border-radius:0;padding:0;margin:0;vertical-align:middle}.cg-logo svg{width:32px;height:32px;display:block;flex:0 0 32px;background:transparent;border:0;border-radius:0;padding:0;margin:0}
.nav{display:flex;flex-direction:column;gap:1px;padding:6px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-size:14px;color:var(--sidebar-text);text-align:start;width:100%;transition:background .15s}
.nav-item:hover{background:var(--sidebar-hover)}
.nav-item svg{width:17px;height:17px;color:var(--sidebar-dim);flex:none}
.nav-item.primary{border:1px solid #CC000044}
.recents{flex:1;overflow-y:auto;padding:8px}
.recents-label{font-size:11px;color:var(--sidebar-dim);padding:8px 11px 4px;font-weight:600}
.recent-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 11px;border-radius:8px;font-size:13.5px;color:var(--sidebar-text);text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-item:hover{background:var(--sidebar-hover)}
.recent-item svg{width:15px;height:15px;color:var(--sidebar-dim);flex:none}
.sidebar-footer{padding:8px;border-top:1px solid #CC000022}
.user-chip{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:8px;text-align:start}
.user-chip:hover{background:var(--sidebar-hover)}
.user-chip b{font-size:13.5px;display:block}
.user-chip small{font-size:11.5px;color:var(--sidebar-dim)}
/* Main column */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.header{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--border);position:relative;z-index:30}
.header .menu-btn{display:none}
.header-brand{display:flex;align-items:center;gap:7px;height:40px;font-size:16.5px;font-weight:600;color:var(--text);white-space:nowrap}
.header-brand .cg-logo{width:32px;height:32px;flex:0 0 32px}
.header-brand .cg-logo svg{width:32px;height:32px;flex:0 0 32px}
.model-btn{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;font-size:16.5px;font-weight:600;color:var(--text)}
.model-btn:hover{background:var(--bg-secondary)}
.model-btn .chev{width:15px;height:15px;color:var(--text-tertiary)}
.header-spacer{flex:1}
.share-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid var(--border);font-size:13px;transition:background .15s;color:var(--text-secondary)}
.share-btn:hover{background:var(--bg-secondary)}
.share-btn svg{width:14px;height:14px}
/* Model dropdown / generic menu */
.menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:5px;min-width:230px;z-index:80;display:none}
.menu.open{display:block}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:8px;font-size:13.5px;text-align:start;color:var(--text)}
.menu-item:hover{background:var(--bg-secondary)}
.menu-item.active{color:var(--cg-red);font-weight:600}
.menu-sep{height:1px;background:var(--border);margin:5px 8px}
.menu-label{font-size:11px;color:var(--text-tertiary);padding:6px 11px 3px;font-weight:600}
/* Thread */
.thread{flex:1;overflow-y:auto;padding:var(--thread-pad,20px) 0}
.content,.msg.user .bubble,.composer textarea{font-size:var(--message-font-size,15.5px)}
.thread-inner{max-width:768px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:var(--thread-gap,24px)}
.msg{display:flex;gap:14px;animation:fadein var(--fade-duration,.25s) ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--bubble-user);border:1px solid var(--bubble-border);border-radius:18px;padding:10px 16px;max-width:78%;font-size:15.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.avatar{width:32px;height:32px;border-radius:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:0 0 32px;margin-top:2px;padding:0;border:0}
.avatar svg{width:32px;height:32px;display:block;flex:0 0 32px;background:transparent;border:0;border-radius:0;padding:0;margin:0}
/* iOS Safari: keep inline assistant marks on their own stable paint layer. */
.avatar{isolation:isolate;-webkit-transform:translateZ(0);transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.avatar svg{-webkit-transform:translateZ(0);transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden;visibility:visible;opacity:1}
.msg .body{min-width:0;max-width:100%;flex:1}
.content{font-size:15.5px;line-height:1.7;word-break:break-word;color:var(--text)}
.content p{margin:0 0 10px}.content p:last-child{margin-bottom:0}
.content h2,.content h3,.content h4{margin:16px 0 8px;line-height:1.35;color:var(--text)}
.content ul{margin:8px 0 12px;padding-inline-start:22px}.content li{margin:4px 0}
.content a{color:var(--cg-red)}
.inline-code{font-family:var(--mono);font-size:.86em;background:var(--bg-secondary);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--text-secondary)}
/* thinking / search states */
.thinking{display:flex;align-items:center;gap:9px;color:var(--text-secondary);font-size:14px;padding:4px 0}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--cg-red);animation:spin var(--spin-duration,.8s) linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.think-details{font-size:12.5px;color:var(--text-tertiary);padding-block:4px 0;padding-inline:24px 0}
.search-state b{font-size:14px;color:var(--text-secondary)}
.source-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.source{font-size:12px;border:1px solid var(--border);border-radius:99px;padding:4px 11px;color:var(--text-secondary);transition:all .3s}
.source.done{background:var(--cg-red-soft);border-color:var(--cg-red);color:var(--cg-red)}
/* action bar */
.actions{display:flex;gap:3px;margin-top:10px;opacity:.85}
.action{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-secondary)}
.action:hover{background:var(--bg-secondary);color:var(--text)}
.action.active{color:var(--cg-red);background:var(--cg-red-soft)}
.action svg{width:16px;height:16px}
/* ===== Premium WormGPT code block (adapted from supplied preview) ===== */
.codeblock{position:relative;border:1px solid #5a2222;border-radius:18px;overflow:hidden;margin:10px 0 14px;background:#120c0c;box-shadow:0 0 0 1px rgba(204,0,0,.12),0 18px 50px rgba(0,0,0,.38),0 0 64px rgba(204,0,0,.07),inset 0 1px 0 rgba(255,255,255,.05)}
.codeblock::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,#e60000,#ff4a2a,#e60000,transparent);pointer-events:none;z-index:2}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px 9px 12px;background:linear-gradient(180deg,#221010,#160c0c);border-bottom:1px solid #3f1c1c}
.code-left{display:flex;align-items:center;gap:9px;min-width:0}
.code-mark{width:23px;height:23px;border-radius:7px;background:radial-gradient(circle at 30% 30%,#3a1515,#1a0a0a);border:1px solid #5a2020;display:grid;place-items:center;flex:none;color:#ef7777}
.code-mark svg{width:14px;height:14px}
.code-meta{min-width:0;display:flex;flex-direction:column;gap:1px}
.code-file{font-family:var(--mono);font-size:11px;color:#f0e8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-lang{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#e07070}
.code-actions{display:flex;gap:6px;flex:none;align-items:center}
.code-actions button{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#d8d0d0;padding:7px 10px;border-radius:10px;border:1px solid #4a2424;background:#1a1010;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .15s;white-space:nowrap}
.code-actions button:hover{background:rgba(204,0,0,.14);border-color:#CC000088;color:#fff}
.code-actions button:active{transform:scale(.97)}
.code-actions svg{width:13px;height:13px}
.code-actions .btn-run{background:linear-gradient(180deg,#e60000,#b00000);border-color:#ff5a5a55;color:#fff;font-weight:650;box-shadow:0 0 0 1px rgba(230,0,0,.2),0 8px 18px rgba(204,0,0,.2)}
.code-actions .btn-run:hover{background:linear-gradient(180deg,#ff1a1a,#c40000);color:#fff}
.code-body{display:flex;align-items:stretch;max-height:min(52vh,420px);overflow:auto;background:linear-gradient(180deg,#160e0e 0%,#100c0c 100%);scrollbar-width:thin;scrollbar-color:#5a3030 transparent}
.code-gutter{flex:none;padding:15px 0 17px 12px;min-width:2.8em;font-family:var(--mono);font-size:12px;line-height:1.75;color:#6a4a4a;text-align:right;user-select:none;border-right:1px solid #2a1818;background:#110c0c}
.code-gutter span{display:block;padding-right:10px}
.codeblock pre.code{margin:0;padding:15px 15px 17px 13px;flex:1;min-width:0;max-height:none;overflow:visible;font-family:var(--mono);font-size:12.8px;line-height:1.75;color:#ece8ef;background:transparent;direction:ltr;text-align:left;white-space:pre;tab-size:2}
.codeblock pre.code.wrap{white-space:pre-wrap;word-break:break-word}
.code-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 13px;border-top:1px solid #2a1818;background:#140e0e;font-size:10px;color:#8a7070;font-family:var(--mono)}
.code .kw{color:#ff7a93}.code .str{color:#b6e89a}.code .comment{color:#6d6570;font-style:italic}.code .num{color:#f7b56b}.code .fn{color:#8cb4ff}.code .op{color:#ff9b6a}
@media(max-width:560px){.code-head{gap:6px;padding:8px}.code-actions{gap:4px}.code-actions button{padding:7px 8px;font-size:11px}.code-actions button span{display:none}.code-file{max-width:105px}.codeblock pre.code{font-size:11.5px}.code-gutter{font-size:11px}}
/* Composer */
.composer-wrap{flex:none;padding:8px 20px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.composer{width:100%;max-width:768px;background:var(--composer-bg);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);padding:8px 8px 8px 6px;position:relative;transition:border-color .15s}
.composer:focus-within{border-color:#CC000066}
.composer-row{display:flex;align-items:flex-end;gap:4px}
.composer textarea{flex:1;border:0;outline:0;background:none;resize:none;max-height:220px;padding:9px 8px;font-size:15.5px;line-height:1.5;color:var(--text)}
.composer textarea::placeholder{color:var(--text-tertiary)}
.round-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;transition:background .15s}
.round-btn:hover{background:var(--bg-secondary)}
.round-btn svg{width:20px;height:20px}
.send-btn{background:var(--cg-red);color:#fff}
.send-btn:hover:not(:disabled){background:var(--cg-red-dark)}
.send-btn:disabled{background:var(--text-tertiary);opacity:.45;cursor:not-allowed}
.send-btn svg{width:17px;height:17px}
.mic-btn.listening{background:var(--cg-red-soft);color:var(--cg-red);animation:pulse var(--pulse-duration,1.4s) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(204,0,0,.14)}}
.composer-hint{text-align:center;font-size:11px;color:var(--text-tertiary);padding-top:9px;user-select:none}
/* chips (files / mode) */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:99px;padding:4px 11px;color:var(--text-secondary)}
.mode-chip{color:var(--cg-red);background:var(--cg-red-soft);border-color:transparent;font-weight:600}
/* overlays */
.backdrop{position:fixed;inset:0;background:var(--backdrop);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.backdrop.open{opacity:1;pointer-events:auto}
/* settings panel */
.settings{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100vw);background:var(--surface);z-index:70;transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
[dir="rtl"] .settings{transform:translateX(-105%)}
.settings.open{transform:translateX(0)}
.settings-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);flex:none}
.settings-head h2{font-size:16.5px;flex:1;color:var(--text)}
.settings-body{flex:1;overflow-y:auto}
.set-nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;flex:none;border-bottom:1px solid var(--border);scrollbar-width:none}
.set-nav button{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--border);color:var(--text-secondary)}
.set-nav button svg{width:13px;height:13px}
.set-nav button.active{background:var(--cg-red);border-color:var(--cg-red);color:#fff}
.set-sec{display:none;padding:18px 20px 30px}
.set-sec.active{display:block}
.set-sec>p{font-size:12.5px;color:var(--text-tertiary);margin:4px 0 16px}
.set-sec h3{font-size:17px;color:var(--text)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--border)}.set-label{min-width:0;flex:1}.set-row .setting-static{flex:0 0 auto}.range-control{display:flex;align-items:center;gap:10px;flex:none}.range-control output{font-size:12px;color:var(--text-secondary);min-width:24px;text-align:end}
.set-row strong{font-size:13.5px;display:block;color:var(--text)}
.set-label span{font-size:12px;color:var(--text-tertiary);display:block;margin-top:2px;max-width:260px;line-height:1.5}
/* toggle */
.toggle{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.toggle input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2}
.toggle i{position:absolute;inset:0;border-radius:99px;background:var(--text-tertiary);opacity:.45;transition:.2s}
.toggle i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.toggle input:checked+i{background:var(--cg-red);opacity:1}
.toggle input:checked+i::after{transform:translateX(18px)}
[dir="rtl"] .toggle input:checked+i::after{transform:translateX(-18px)}
.select{background:var(--bg-secondary);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:13px;max-width:190px;color:var(--text)}
.text-input{background:var(--bg-secondary);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;min-width:200px;color:var(--text)}

textarea.text-input{resize:vertical;min-width:min(300px,55vw)}
.set-row-custom{display:flex;flex-direction:column;align-items:stretch;gap:10px}
.set-row-custom .set-label{width:100%;flex:none}
.set-row-custom .set-label span{max-width:none}
.set-row-custom textarea.custom-instructions{display:block;width:100%;max-width:100%;min-width:0;min-height:150px;box-sizing:border-box;line-height:1.65;padding:13px 14px;border-radius:12px;background:var(--bg-secondary);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;transition:border-color .18s,box-shadow .18s}

@media(max-width:860px){
  .sidebar{z-index:40}
  .sidebar.open{z-index:75;box-shadow:0 0 35px rgba(0,0,0,.55)}
}
@media(max-width:560px){
  .nav-item{min-height:44px;padding:10px 12px}
  .nav-item>span:nth-child(2){font-size:15px}
}
.content,.msg.user .bubble,.composer textarea{font-size:var(--message-font-size,15.5px)}

/* ===== Repair: tokens, light theme, menus, usage, chrome polish ===== */
:root{--bubble-border:#4a2424;--radius-sm:8px;--radius-md:12px;--radius-lg:18px;--ring:0 0 0 2px var(--bg),0 0 0 4px color-mix(in srgb,var(--cg-red) 70%,transparent);--menu-shadow:0 24px 60px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3),0 0 0 1px rgba(204,0,0,.14);color-scheme:dark}
html[data-cg-theme="light"]{color-scheme:light;--bg:#f7f4f4;--bg-secondary:#efe8e8;--surface:#ffffff;--text:#1d1515;--text-secondary:#4f4343;--text-tertiary:#857777;--border:#ead8d8;--bubble-user:#fbeaea;--bubble-border:#f0cccc;--sidebar-bg:#f4eeee;--sidebar-text:#1d1515;--sidebar-dim:#7d6d6d;--sidebar-hover:#CC000014;--composer-bg:#ffffff;--shadow:0 8px 28px rgba(80,0,0,.08);--backdrop:rgba(25,5,5,.38);--menu-shadow:0 22px 50px rgba(60,0,0,.16),0 0 0 1px rgba(204,0,0,.1)}
html[data-cg-theme="light"] .sidebar-footer{border-top-color:var(--border)}
html[data-cg-theme="light"] .model-btn:hover,html[data-cg-theme="light"] .round-btn:hover{background:var(--bg-secondary)}
.codeblock,.codeblock pre,.console,.run-frame{direction:ltr;text-align:left}
.inline-code{unicode-bidi:isolate;direction:ltr}
.msg.user .bubble{border-color:var(--bubble-border)}
.content[dir="auto"],.bubble[dir="auto"]{unicode-bidi:plaintext}
.composer-shell{width:100%;max-width:820px}
@media(min-width:1100px){.composer-shell{max-width:900px}}
.composer-shell .composer{max-width:none}

/* ---- chrome polish (identity kept: dark red, same layout) ---- */
.header{border-bottom-color:color-mix(in srgb,var(--cg-red) 22%,var(--border));background:linear-gradient(180deg,color-mix(in srgb,var(--cg-red) 7%,var(--bg)),var(--bg) 86%)}
.model-btn{padding:7px 12px 7px 8px;border:1px solid transparent;border-radius:12px;gap:6px}
.model-btn:hover{background:color-mix(in srgb,var(--cg-red) 8%,var(--bg-secondary));border-color:color-mix(in srgb,var(--cg-red) 22%,var(--border))}
.model-btn[aria-expanded="true"]{background:color-mix(in srgb,var(--cg-red) 12%,var(--bg-secondary));border-color:color-mix(in srgb,var(--cg-red) 35%,var(--border))}
.nav-item{border-radius:10px}
.nav-item:hover,.recent-item:hover,.user-chip:hover{background:color-mix(in srgb,var(--cg-red) 10%,transparent)}
.nav-item.primary{background:color-mix(in srgb,var(--cg-red) 7%,transparent)}
.composer{box-shadow:0 10px 32px rgba(0,0,0,.22),0 0 0 1px color-mix(in srgb,var(--cg-red) 10%,transparent);border-color:color-mix(in srgb,var(--cg-red) 28%,var(--border))}
.composer:focus-within{border-color:color-mix(in srgb,var(--cg-red) 70%,var(--border));box-shadow:0 12px 36px rgba(0,0,0,.28),0 0 0 3px color-mix(in srgb,var(--cg-red) 18%,transparent)}
.send-btn{box-shadow:0 4px 14px color-mix(in srgb,var(--cg-red) 45%,transparent)}
.send-btn:disabled{box-shadow:none}
.msg.user .bubble{box-shadow:0 8px 22px rgba(0,0,0,.16)}
.sidebar{border-inline-end:1px solid color-mix(in srgb,var(--cg-red) 16%,transparent)}

/* ---- unified premium menus ---- */
.menu{position:fixed;box-sizing:border-box;padding:8px;border-radius:18px;border:1px solid color-mix(in srgb,var(--cg-red) 26%,var(--border));background:color-mix(in srgb,var(--surface) 82%,#0a0a0a 18%);box-shadow:var(--menu-shadow);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);transform-origin:var(--menu-origin-x,24px) var(--menu-origin-y,0);overflow:auto}
html[data-cg-theme="light"] .menu{background:color-mix(in srgb,var(--surface) 90%,#fff)}
.menu::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);pointer-events:none}
html[data-cg-theme="light"] .menu::before{background:linear-gradient(90deg,transparent,rgba(204,0,0,.18),transparent)}
.menu[data-side="top"]{--menu-origin-y:100%}
.menu.open{display:block;animation:menu-in .16s cubic-bezier(.2,.8,.2,1)}
.menu[data-side="top"].open{animation-name:menu-in-up}
@keyframes menu-in{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes menu-in-up{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.menu-head{padding:8px 12px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}
.menu-kicker{padding:8px 12px 4px;font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--cg-red) 70%,var(--text-tertiary))}
.menu-sep{height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--cg-red) 35%,var(--border)),transparent);margin:8px 8px}
.menu-label{font-size:11px;color:var(--text-tertiary);padding:6px 11px 3px;font-weight:600}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:12px;font-size:13.5px;text-align:start;color:var(--text);transition:background .14s,color .14s,transform .14s}
.menu-item:hover,.menu-item:focus-visible{background:color-mix(in srgb,var(--cg-red) 12%,var(--bg-secondary));outline:none}
.menu-item:focus-visible{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cg-red) 55%,transparent)}
.menu-item:active{transform:scale(.985)}
.menu-ico{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--cg-red) 14%,var(--bg-secondary));color:var(--text);border:1px solid color-mix(in srgb,var(--cg-red) 16%,transparent);transition:background .14s,color .14s,border-color .14s}
.menu-ico svg{width:18px;height:18px}
.menu-item:hover .menu-ico,.menu-item:focus-visible .menu-ico,.menu-item.active .menu-ico,.menu-item.is-on .menu-ico{background:color-mix(in srgb,var(--cg-red) 28%,var(--bg-secondary));color:#fff;border-color:color-mix(in srgb,var(--cg-red) 45%,transparent)}
.menu-copy{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.menu-copy b{display:block;font-size:13.5px;font-weight:650;line-height:1.25;color:var(--text)}
.menu-copy small{display:block;font-size:11.5px;line-height:1.4;color:var(--text-tertiary);font-weight:450}
.menu-item.active,.menu-item[aria-checked="true"]{color:var(--text);background:color-mix(in srgb,var(--cg-red) 12%,transparent)}
.menu-item.active .menu-copy b,.menu-item[aria-checked="true"] .menu-copy b{color:var(--cg-red)}
.menu-item[aria-checked="true"]::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--cg-red);box-shadow:0 0 0 3px color-mix(in srgb,var(--cg-red) 22%,transparent);margin-inline-start:auto;flex:none}
#plus-menu{min-width:300px;max-width:min(360px,calc(100vw - 24px))}
#plus-menu .menu-item{min-height:56px;padding:8px 10px}
#model-menu{min-width:260px;max-width:min(340px,calc(100vw - 24px))}
#plus-menu .menu-item[aria-pressed="true"],#plus-menu .menu-item.is-on{background:color-mix(in srgb,var(--cg-red) 14%,transparent)}
#plus-menu .menu-item[aria-pressed="true"] .menu-copy b,#plus-menu .menu-item.is-on .menu-copy b{color:var(--cg-red)}

/* ---- focus & interaction states ---- */
:where(button,[role="menuitem"],select,input[type="checkbox"],.text-input,.select):focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--radius-sm)}
.round-btn:focus-visible,.send-btn:focus-visible{border-radius:50%}
.round-btn:active:not(:disabled),.action:active,.icon-btn:active,.share-btn:active,.usage-btn:active{transform:scale(.96)}
.round-btn,.action,.icon-btn,.share-btn,.usage-btn{transition:background .15s,border-color .15s,color .15s,transform .12s,box-shadow .15s}
.send-btn.is-sending{opacity:.7;cursor:progress}
.select,.text-input,.search-input{transition:border-color .15s,box-shadow .15s}
.select:hover,.text-input:hover{border-color:color-mix(in srgb,var(--cg-red) 35%,var(--border))}

/* ---- usage indicator ---- */
.usage-btn{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 11px;border-radius:99px;border:1px solid var(--border);font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-secondary);white-space:nowrap}
.usage-btn:hover,.usage-btn[aria-expanded="true"]{background:var(--bg-secondary);color:var(--text);border-color:color-mix(in srgb,var(--cg-red) 30%,var(--border))}
.usage-btn[hidden]{display:none}
.usage-meter{width:26px;height:4px;border-radius:99px;background:color-mix(in srgb,var(--text-tertiary) 35%,transparent);overflow:hidden;flex:none}
.usage-meter i{display:block;height:100%;width:var(--usage-pct,0%);background:var(--text-secondary);border-radius:inherit;transition:width .3s ease}
.usage-btn.is-low{color:#f0b35a;border-color:#f0b35a55}.usage-btn.is-low .usage-meter i{background:#f0b35a}
.usage-btn.is-empty{color:var(--cg-red);border-color:color-mix(in srgb,var(--cg-red) 45%,transparent)}.usage-btn.is-empty .usage-meter i{background:var(--cg-red)}
.usage-menu{min-width:268px;max-width:min(320px,calc(100vw - 20px));padding:6px 8px 10px}
.usage-big{font-size:28px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.6px;padding:2px 12px 2px;line-height:1.15}
.usage-big span{font-size:13px;font-weight:550;color:var(--text-tertiary);margin-inline-start:4px;letter-spacing:0}
.usage-bar{height:7px;border-radius:99px;background:color-mix(in srgb,var(--text-tertiary) 22%,var(--bg-secondary));margin:8px 12px 12px;overflow:hidden}
.usage-bar i{display:block;height:100%;width:var(--usage-pct,0%);background:linear-gradient(90deg,var(--cg-red-dark),var(--cg-red));border-radius:inherit}
.usage-line{font-size:12.5px;color:var(--text-secondary);line-height:1.55;padding:0 12px}
.usage-remain{color:var(--text);font-weight:650}
.usage-note{font-size:11px;color:var(--text-tertiary);line-height:1.55;margin:10px 8px 2px;padding:10px 8px 2px;border-top:1px solid color-mix(in srgb,var(--cg-red) 18%,var(--border))}
@media(max-width:560px){.usage-btn{padding:6px 9px;gap:5px;min-height:34px}.usage-meter{width:18px}#plus-menu{min-width:min(300px,calc(100vw - 20px))}}

/* ---- daily limit card ---- */
.limit-card{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px;padding:14px 15px;border:1px solid color-mix(in srgb,var(--cg-red) 42%,var(--border));border-radius:18px;background:linear-gradient(180deg,var(--cg-red-soft),transparent 120%),var(--surface);box-shadow:var(--shadow);animation:fadein var(--fade-duration,.25s) ease}
.limit-card[hidden]{display:none}
.limit-icon{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--cg-red-soft);color:var(--cg-red);border:1px solid color-mix(in srgb,var(--cg-red) 22%,transparent)}
.limit-icon svg{width:18px;height:18px}
.limit-text{flex:1;min-width:0}
.limit-text b{display:block;font-size:14.5px;color:var(--text);margin-bottom:4px}
.limit-text p{font-size:12.5px;line-height:1.6;color:var(--text-secondary)}
.limit-text .limit-countdown{display:inline-block;margin-top:7px;font-size:11.5px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.limit-card .icon-btn{width:30px;height:30px;color:var(--text-tertiary)}
.limit-card .icon-btn svg{width:16px;height:16px}
.composer.is-limited{opacity:.72}
.composer.is-limited textarea::placeholder{color:var(--text-secondary)}

/* ---- message states ---- */
.msg.msg-error .content{border-inline-start:2px solid color-mix(in srgb,var(--cg-red) 60%,transparent);padding-inline-start:12px}
.msg.msg-error .content strong:first-child{color:var(--text)}
.content blockquote{margin:10px 0;padding:6px 12px;border-inline-start:2px solid var(--border);color:var(--text-secondary)}
.action[aria-pressed="true"]{color:var(--cg-red);background:var(--cg-red-soft)}
.actions{opacity:.8;transition:opacity .15s}.msg:hover .actions,.actions:focus-within{opacity:1}

/* ---- desktop sidebar collapse ---- */
@media(min-width:861px){.app.side-collapsed .sidebar{display:none}.app.side-collapsed .header .menu-btn{display:grid}}

/* ---- modal entrance ---- */
.modal.open .dialog{animation:dialog-in .16s ease-out;border-radius:18px;box-shadow:0 28px 70px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--cg-red) 16%,transparent)}
@keyframes dialog-in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal.page-mode.open .dialog{animation:none}

/* ---- in-app Reduce motion must cover every transition ---- */
html[data-cg-motion="0"] *,html[data-cg-motion="0"] *::before,html[data-cg-motion="0"] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){.menu.open,.modal.open .dialog{animation:none}}


/* ---- refined sidebar / chrome icons ---- */
.nav-item svg{width:18px;height:18px;color:var(--sidebar-dim);flex:none;transition:color .15s,transform .15s}
.nav-item:hover svg,.nav-item.primary svg,.nav-item:focus-visible svg{color:var(--cg-red)}
.nav-item.primary svg{color:var(--cg-red)}
.user-chip svg,.sidebar-support-icon svg{width:18px;height:18px;color:var(--sidebar-dim);transition:color .15s}
.user-chip:hover svg,.sidebar-support-btn:hover svg{color:var(--cg-red)}
.icon-btn svg,.round-btn svg,.share-btn svg,.model-btn .chev svg{transition:color .15s,transform .15s}
.round-btn:hover svg,.share-btn:hover svg{color:var(--cg-red)}
.send-btn:not(:disabled) svg{color:#fff}

/* ==== Stable viewport height (iOS browser chrome) — --app-height is set from visualViewport ==== */
body{height:var(--app-height,100dvh)}
.app{height:var(--app-height,100dvh)}

/* ---- cinematic intro: poster always underneath, video fades in only once it truly plays ---- */
.cg-intro{position:fixed;inset:0;height:var(--app-height,100dvh);z-index:4000;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 70% 55% at 50% 52%,rgba(150,0,0,.55),transparent 70%),radial-gradient(ellipse 120% 60% at 50% 110%,rgba(110,0,0,.6),transparent 70%),#050505;
  --em:clamp(104px,30vh,250px);--wb:clamp(58px,12vh,118px)}
.cg-intro.is-leaving{opacity:0;transform:scale(1.03);pointer-events:none;transition:opacity .7s ease,transform .7s ease}
.cg-intro.is-done,.cg-intro[hidden]{display:none}
.cg-intro-media{position:absolute;inset:0;overflow:hidden}
.cg-intro-media img,.cg-intro-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.cg-intro-media img{opacity:0;transform:scale(1.14);filter:brightness(.3) saturate(1.2) blur(7px);transition:opacity .6s ease,filter .8s ease;animation:cg-ken 7s ease-out forwards}
.cg-intro.has-poster .cg-intro-media img{opacity:1}
.cg-intro.has-video .cg-intro-media img{filter:none}
.cg-intro-media video{opacity:0;visibility:hidden;transition:opacity .6s ease;background:transparent}
.cg-intro-media video.is-ready{opacity:1;visibility:visible}
@keyframes cg-ken{to{transform:scale(1.02)}}
.cg-intro-smoke{position:absolute;inset:-10%;pointer-events:none;transition:opacity .8s ease}
.cg-intro.has-video .cg-intro-smoke{opacity:.35}
.cg-intro-smoke i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;background:radial-gradient(circle,rgba(190,10,10,.42),rgba(120,0,0,.18) 45%,transparent 70%);filter:blur(28px);opacity:.75;animation:cg-smoke 9s ease-in-out infinite alternate}
.cg-intro-smoke i:nth-child(1){left:-18%;bottom:-30%}
.cg-intro-smoke i:nth-child(2){right:-22%;bottom:-26%;animation-delay:-3s;animation-duration:11s}
.cg-intro-smoke i:nth-child(3){left:20%;top:-40%;opacity:.35;animation-delay:-5s}
.cg-intro-smoke i:nth-child(4){left:25%;bottom:-45%;width:80vmax;height:50vmax;opacity:.6;animation-duration:13s}
@keyframes cg-smoke{from{transform:translate3d(-4%,2%,0) scale(1)}to{transform:translate3d(5%,-6%,0) scale(1.18)}}
.cg-intro-shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.5) 100%),linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 30%,transparent 62%,rgba(0,0,0,.6) 100%)}
.cg-intro-brand{position:absolute;inset:0;pointer-events:none;z-index:2}
.cg-intro-emblem{position:absolute;left:50%;top:50%;width:var(--em);height:var(--em);translate:-50% -50%;transition:opacity .7s ease}
.cg-intro-emblem svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 18px rgba(230,0,0,.75)) drop-shadow(0 0 54px rgba(230,0,0,.4));animation:cg-emblem-in 1.1s cubic-bezier(.2,.8,.2,1) both,cg-spin 12s linear infinite}
.cg-intro-emblem svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 18px rgba(230,0,0,.75)) drop-shadow(0 0 54px rgba(230,0,0,.4));animation:cg-emblem-in 1.1s cubic-bezier(.2,.8,.2,1) both,cg-spin 12s linear infinite}
.cg-intro.has-video .cg-intro-emblem{opacity:0}
@keyframes cg-emblem-in{from{opacity:0;scale:.55}to{opacity:1;scale:1}}
@keyframes cg-spin{to{rotate:360deg}}
.cg-intro-word{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--wb));text-align:center;font-weight:700;font-size:clamp(17px,2.4vw,28px);letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;color:#fff;text-shadow:0 0 26px rgba(230,0,0,.65),0 2px 16px rgba(0,0,0,.9);opacity:0;animation:cg-word-in 1.2s ease .6s forwards}
@keyframes cg-word-in{from{opacity:0;letter-spacing:.7em;filter:blur(6px)}to{opacity:1;letter-spacing:.34em;filter:none}}
.cg-intro-bar{position:absolute;left:50%;translate:-50% 0;bottom:calc(env(safe-area-inset-bottom) + var(--wb) - 24px);width:min(140px,36vw);height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:cg-word-in .6s ease .9s forwards}
.cg-intro-bar i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,#8a0000,#ff2a1a);box-shadow:0 0 10px #ff2a1a;animation:cg-bar 5.4s linear forwards}
@keyframes cg-bar{to{transform:scaleX(1)}}
body.cg-intro-active{overflow:hidden}
@media(max-height:480px){.cg-intro{--em:clamp(80px,34vh,160px);--wb:34px}.cg-intro-word{font-size:15px}}
html[data-cg-motion="0"] .cg-intro-emblem svg,html[data-cg-motion="0"] .cg-intro-smoke i,html[data-cg-motion="0"] .cg-intro-media img{animation:none!important}
@media(prefers-reduced-motion:reduce){.cg-intro-emblem svg,.cg-intro-smoke i,.cg-intro-media img{animation:none!important}}

/* ---- empty-thread cinematic stage; fades on first message or while a page view is open ---- */
.thread{position:relative}
.cg-stage{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;opacity:1;transition:opacity .7s ease,visibility .7s ease;
  background:radial-gradient(ellipse 60% 50% at 50% 45%,rgba(140,0,0,.35),transparent 70%),radial-gradient(ellipse 110% 50% at 50% 105%,rgba(100,0,0,.45),transparent 70%),var(--bg)}
.cg-stage.is-off{opacity:0;visibility:hidden}
.cg-stage-media{position:absolute;inset:0}
.cg-stage-media img,.cg-stage-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 48%;display:block;filter:saturate(.95) brightness(.66)}
.cg-stage-media img{opacity:0;transition:opacity .6s ease}
.cg-stage.has-poster .cg-stage-media img{opacity:1}
.cg-stage-media video{opacity:0;visibility:hidden;transition:opacity .8s ease}
.cg-stage-media video.is-ready{opacity:1;visibility:visible}
.cg-stage-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,12,.5) 0%,rgba(12,12,12,.08) 32%,rgba(12,12,12,.12) 62%,var(--bg) 100%),radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.5) 100%)}
.cg-stage-embers{position:absolute;inset:0}
.cg-stage-embers i{position:absolute;bottom:-8px;width:3px;height:3px;border-radius:50%;background:#ff4a2a;box-shadow:0 0 8px 1px rgba(255,40,10,.8);opacity:0;animation:cg-ember 9s linear infinite}
.cg-stage-embers i:nth-child(1){left:12%;animation-delay:0s}
.cg-stage-embers i:nth-child(2){left:28%;animation-delay:-2.5s;animation-duration:11s}
.cg-stage-embers i:nth-child(3){left:46%;animation-delay:-5s}
.cg-stage-embers i:nth-child(4){left:63%;animation-delay:-1.2s;animation-duration:12s}
.cg-stage-embers i:nth-child(5){left:79%;animation-delay:-6.4s}
.cg-stage-embers i:nth-child(6){left:91%;animation-delay:-3.8s;animation-duration:10s}
@keyframes cg-ember{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.9}70%{opacity:.6}100%{transform:translate3d(24px,-70vh,0);opacity:0}}

  border:1px solid color-mix(in srgb,var(--cg-red) 28%,var(--border));background:linear-gradient(135deg,rgba(204,0,0,.24),rgba(204,0,0,.05) 55%,transparent),var(--surface);box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}

.pg-hero-images{background:radial-gradient(ellipse at 88% 10%,rgba(255,70,40,.28),transparent 55%),linear-gradient(135deg,rgba(204,0,0,.2),transparent 60%),var(--surface)}

.pg-card{position:relative;padding:clamp(16px,2.6vw,24px);border-radius:22px;border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--surface);box-shadow:0 16px 44px rgba(0,0,0,.22)}

.pt-field{position:relative;margin-top:16px}

.pg-section-title{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:var(--text-tertiary);margin-top:4px}

.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:12px}

.project-go{flex:none;color:var(--text-tertiary)}.project-go svg{width:18px;height:18px;transform:rotate(-90deg)}

/* empty states */
.pg-empty{grid-column:1/-1;display:grid;justify-items:center;text-align:center;gap:10px;padding:clamp(30px,6vw,58px) clamp(18px,4vw,40px);border-radius:24px;border:1px dashed color-mix(in srgb,var(--cg-red) 32%,var(--border));

.pg-tips{list-style:none;display:grid;gap:8px;margin-top:10px;width:min(420px,100%)}

/* asset toolbar */
.pg .asset-toolbar{padding:12px 12px 12px 16px;border-radius:16px;background:color-mix(in srgb,var(--surface) 85%,transparent);flex-wrap:nowrap}

/* images gallery */
#asset-grid.is-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.gal-dl,.doc-dl{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;flex:none}

/* library documents */
#asset-grid.is-docs{display:grid;grid-template-columns:1fr;gap:9px}

.doc-ico{width:46px;height:46px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:13px;background:var(--cg-red-soft);color:#ff4d4d;border:1px solid rgba(204,0,0,.22)}
.doc-ico svg{width:20px;height:20px}.doc-ico img{width:100%;height:100%;object-fit:cover}

#asset-grid.is-docs .asset-meta{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11px}
.doc-ext{padding:1px 6px;border-radius:6px;background:rgba(204,0,0,.16);color:#ff6b6b;font-weight:750;font-size:9.5px;letter-spacing:.06em}
.doc-dl{border:1px solid var(--border);color:var(--text-tertiary)}
.doc-row:hover .doc-dl{color:var(--cg-red);border-color:color-mix(in srgb,var(--cg-red) 45%,var(--border))}

  .pg-stat b{font-size:17px}.pg-stat small{font-size:9px;margin-top:2px}

  .pg-primary{width:100%}

  .pt-chip{flex:none}
  .pg .asset-toolbar{flex-direction:row;align-items:center}
  .pg .asset-add{width:auto;padding:0 14px}
  .pg .asset-toolbar p{font-size:11.5px}
}
@media(max-width:380px){.pg .asset-toolbar{flex-wrap:wrap}.pg .asset-add{width:100%}}

function placeMenu(name){

/* markdown
   Fixed: code was HTML-escaped twice (showing &lt; instead of <), String.replace() expanded "$&"/"$'"
   inside code, and the highlighter re-matched its own <span class=...> markup. Code and inline code are
   now cut out of the raw text first and escaped exactly once; all replacements use functions. */
const HASH_COMMENT_LANGS=new Set(["py","python","sh","bash","shell","zsh","rb","ruby","yaml","yml","toml","r","perl","pl","dockerfile","makefile","ps1","powershell","conf","ini"]);
const KW=new Set("const let var function return if else for while class import from export default def print async await new try catch finally throw public private protected static void int float double char bool string include using elif lambda None True False true false null undefined this self struct enum interface type extends implements package go fn mut pub match switch case break continue do yield in of is not and or with as".split(" "));
function highlight(code,lang){
  const hashComments=HASH_COMMENT_LANGS.has(String(lang||"").toLowerCase());
  const re=hashComments
    ?/(#[^\n]*|\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g
    :/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;

    out+=esc(code.slice(last,m.index));last=re.lastIndex;
    if(m[1])out+=`<span class="comment">${esc(m[1])}</span>`;
    else if(m[2])out+=`<span class="str">${esc(m[2])}</span>`;
    else if(m[3])out+=`<span class="num">${esc(m[3])}</span>`;
    else if(m[4])out+=KW.has(m[4])?`<span class="kw">${esc(m[4])}</span>`:esc(m[4]);
  }
  return out+esc(code.slice(last));
}
function codeBlockHtml(b){

  const fileName=({html:"index.html",css:"style.css",js:"script.js",ts:"script.ts",py:"main.py",json:"data.json",sh:"script.sh",sql:"query.sql",java:"Main.java",c:"main.c",cpp:"main.cpp",rs:"main.rs",go:"main.go"})[ext]||("snippet."+ext);

function mdToHtml(src){
  const blocks=[],inline=[];
  let s=String(src||"").replace(/[\u0000\u0001]/g,"");
  s=s.replace(/```([\w+#.-]*)[^\n`]*\n?([\s\S]*?)(?:```|$)/g,(mm,lang,code)=>"\u0000"+(blocks.push({lang:(lang||"text").toLowerCase(),code:code.replace(/\n$/,"")})-1)+"\u0000");
  s=s.replace(/`([^`\n]+)`/g,(mm,code)=>"\u0001"+(inline.push(code)-1)+"\u0001");
  s=esc(s);
  s=s.replace(/^### (.*)$/gm,(m,x)=>`<h4>${x}</h4>`).replace(/^## (.*)$/gm,(m,x)=>`<h3>${x}</h3>`).replace(/^# (.*)$/gm,(m,x)=>`<h2>${x}</h2>`);
  s=s.replace(/^&gt; ?(.*)$/gm,(m,x)=>`<blockquote>${x}</blockquote>`);
  s=s.replace(/\*\*(.+?)\*\*/g,(m,x)=>`<strong>${x}</strong>`).replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g,(m,p,x)=>`${p}<em>${x}</em>`);
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,text,url)=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`);
  s=s.replace(/^\s*[-*] (.+)$/gm,(m,x)=>`<li>${x}</li>`).replace(/((?:<li>.*<\/li>\n?)+)/g,m=>`<ul>${m.replace(/\n/g,"")}</ul>`);
  s=s.replace(/(<\/h[234]>|<\/ul>|<\/blockquote>)\n/g,"$1");
  s=s.replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");
  s="<p>"+s+"</p>";
  s=s.replace(/\u0001(\d+)\u0001/g,(m,i)=>`<span class="inline-code">${esc(inline[+i])}</span>`);
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>codeBlockHtml(blocks[+i]));
  s=s.replace(/<p>(\s*(?:<br>)*\s*(?:<div class="codeblock">|<ul>|<h[234]>|<blockquote>))/g,"$1").replace(/(<\/div>|<\/ul>|<\/h[234]>|<\/blockquote>)\s*(?:<br>)*\s*<\/p>/g,"$1").replace(/<p>\s*<\/p>/g,"");
  return s;
}
/* ================= Send pipeline =================

function failureText(err){

  const map={backend_not_configured:["notConfiguredTitle","notConfigured"],session_required:["requestError","sessionExpired"],rate_limited:["requestError","rateLimited"],too_many_concurrent:["requestError","busy"],request_in_progress:["requestError","busy"],payload_too_large:["requestError","tooLarge"],file_too_large:["requestError","tooLarge"],message_too_long:["requestError","tooLarge"],too_many_files:["requestError","tooLarge"],instructions_too_long:["requestError","tooLarge"],unsupported_file:["requestError","unsupportedFile"],ip_daily_limit_reached:["requestError","ipLimit"]};

async function runAssistant(id,prompt,files,opts={}){

  // Context = turns before the user message being answered (works for regenerate in the middle too).
  const uIdx=state.messages.findIndex(m=>m.id===opts.userId);
  const before=uIdx>=0?state.messages.slice(0,uIdx):state.messages.filter(m=>m.id!==id).slice(0,-1);

    let finalText=answer;

      const lines=data.sources.slice(0,8).map((x,i)=>`${i+1}. ${x.title||"Source"}${x.url?" — "+x.url:""}`).join("\n");

  }catch(err){
    if(err?.code==="daily_limit_reached"){applyUsage(err.body,true);showLimitCard(true);return "limit"}

async function consumeStream(id,r,onUsage){

async function stream(id,text){

  el.innerHTML=`<div class="thinking"><span class="spinner"></span><span>${esc(t("generating"))}</span></div><div class="think-details">${esc(t("genDetails"))}</div>`;
  await wait(300);

   Same data and behaviour as before: local search over saved chats + the current conversation,

function searchCorpus(){
  const all=state.chats.flatMap(c=>(c.messages||[]).map(m=>({...m,chatId:c.id,chatTitle:c.title})));
  if(state.messages.length&&!all.some(m=>m.id===state.messages[0]?.id))all.push(...state.messages.map(m=>({...m,chatId:state.activeChatId,chatTitle:t("currentConversation")})));
  return all;
}
function searchSnippet(text,q){
  const raw=String(text||"");
  const low=raw.toLocaleLowerCase();
  const i=low.indexOf(q);
  // toLocaleLowerCase can change string length for a few scripts; then fall back to a plain excerpt.
  if(i<0||low.length!==raw.length)return esc(raw.slice(0,150));
  const start=Math.max(0,i-48),end=Math.min(raw.length,i+q.length+96);
  return (start>0?"…":"")+esc(raw.slice(start,i))+"<mark>"+esc(raw.slice(i,i+q.length))+"</mark>"+esc(raw.slice(i+q.length,end))+(end<raw.length?"…":"");
}

async function exportConversationTxt(){
  saveActiveChat();
  const chat=state.chats.find(c=>c.id===state.activeChatId);
  const messages=chat?.messages||state.messages;
  if(!messages.length){toast(t("exportEmpty"));return}
  const title=chat?.title||"WormGPT conversation";
  // Real newlines: the previous build wrote the two characters "\\" "n" into the TXT.
  const lines=[title,t("exported")+": "+new Date().toLocaleString(uiLocale()),"=".repeat(38),
    ...messages.filter(m=>!m.error).map(m=>(m.role==="user"?t("you"):"WORMGPT")+"\n"+(m.content||"["+t("attachment")+"]")+
      (m.files?.length?"\n"+t("attachments")+": "+m.files.join(", "):""))];
  const blob=new Blob([lines.join("\n\n")],{type:"text/plain;charset=utf-8"});
  const filename="WormGPT-"+(title.replace(/[^\p{L}\p{N}_-]+/gu,"-").replace(/^-+|-+$/g,"").slice(0,32)||"chat")+"-"+new Date().toISOString().slice(0,10)+".txt";
  // iPhone/iPad: native share sheet exposes Save to Files when supported.
  try{
    const file=new File([blob],filename,{type:"text/plain"});
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
      await navigator.share({files:[file],title:"Export WormGPT conversation"});
      toast(t("exportSaveFiles"));
      return;
    }
  }catch(err){if(err?.name==="AbortError")return;console.warn("Native file share unavailable",err)}
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast(t("exportStarted"));
}

  dismissedFor:(()=>{try{return sessionStorage.getItem("wormgpt-limit-dismissed")}catch{return null}})()};
const USAGE_ENDPOINT=CONFIG.USAGE_ENDPOINT||"/api/usage";
function refreshUsage(){
  if(location.protocol==="file:"){quota.offline=true;renderUsage();return Promise.resolve()}
  if(quota.inflight)return quota.inflight;
  quota.inflight=fetch(USAGE_ENDPOINT,{credentials:"same-origin",cache:"no-store",headers:{"Accept":"application/json"}})
    .then(async r=>{if(r.ok){applyUsage(await r.json());return}if(r.status===404||r.status===405){quota.offline=true;quota.known=false}renderUsage()})
    .catch(()=>renderUsage())
    .finally(()=>{quota.inflight=null});
  return quota.inflight;
}
function applyUsage(u){
  if(!u||typeof u!=="object")return;
  const limit=Number(u.limit),used=Number(u.used);
  if(!Number.isFinite(limit)||limit<=0||!Number.isFinite(used))return;
  const rem=Number(u.remaining),reset=u.reset_at?new Date(u.reset_at):null;
  Object.assign(quota,{known:true,offline:false,limit,used:Math.min(Math.max(used,0),limit),
    remaining:Math.max(0,Number.isFinite(rem)?rem:limit-used),resetAt:reset&&!isNaN(reset)?reset:null,fetchedAt:Date.now()});
  scheduleUsageReset();renderUsage();
}
function isLimited(){return !!(quota&&quota.known&&quota.remaining<=0&&(!quota.resetAt||Date.now()<quota.resetAt.getTime()))}
function fmtReset(d){
  if(!d)return "—";
  const sameDay=d.toDateString()===new Date().toDateString();
  const o=sameDay?{hour:"2-digit",minute:"2-digit",timeZoneName:"short"}:{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZoneName:"short"};
  try{return new Intl.DateTimeFormat(uiLocale(),o).format(d)}catch{return d.toLocaleString()}
}
function fmtResetShort(d){if(!d)return "—";try{return new Intl.DateTimeFormat(uiLocale(),{hour:"2-digit",minute:"2-digit"}).format(d)}catch{return d.toLocaleTimeString()}}
function fmtCountdown(ms){if(ms<60000)return t("lessMinute");const m=Math.ceil(ms/60000),h=Math.floor(m/60);return h?tf("hoursMin",{h,m:m%60}):tf("minutesOnly",{m})}
function scheduleUsageReset(){
  clearTimeout(quota.resetTimer);if(!quota.resetAt)return;
  const ms=quota.resetAt.getTime()-Date.now()+1500; // refresh just after the server's reset moment
  quota.resetTimer=setTimeout(refreshUsage,Math.min(Math.max(ms,1000),2147000000));
}
function usagePct(){return quota.limit?Math.min(100,Math.round(quota.used/quota.limit*100)):0}
function renderUsage(){
  if(!quota)return;const btn=$("#usage-btn");if(!btn)return;
  if(!quota.known){btn.hidden=true;if(openMenuName==="usage")closeMenus();applyLimitState();return}
  btn.hidden=false;btn.style.setProperty("--usage-pct",usagePct()+"%");
  $("#usage-text").textContent=`${quota.used} / ${quota.limit}`;
  btn.classList.toggle("is-empty",quota.remaining<=0);
  btn.classList.toggle("is-low",quota.remaining>0&&quota.remaining<=Math.max(3,Math.round(quota.limit*.1)));
  const label=[t("usageTitle"),tf("usageUsed",{used:quota.used,limit:quota.limit}),tf("usageRemaining",{n:quota.remaining}),quota.resetAt?tf("usageReset",{time:fmtReset(quota.resetAt)}):""].filter(Boolean).join(" · ");
  btn.setAttribute("aria-label",label);btn.title=label;
  if(openMenuName==="usage"){renderUsageMenu();scheduleMenuReposition()}
  applyLimitState();
}
function renderUsageMenu(){
  if(!quota.known){usageMenu.innerHTML=`<div class="usage-line">${esc(t("usageOffline"))}</div>`;return}
  const pct=usagePct();
  usageMenu.innerHTML=`<div class="menu-head" id="usage-menu-title">${esc(t("usageTitle"))}</div>
   <div class="usage-big" dir="ltr">${quota.used} <span>/ ${quota.limit}</span></div>
   <div class="usage-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${quota.limit}" aria-valuenow="${quota.used}" aria-label="${esc(tf("usageUsed",{used:quota.used,limit:quota.limit}))}" style="--usage-pct:${pct}%"><i></i></div>
   <div class="usage-line">${esc(tf("usageUsed",{used:quota.used,limit:quota.limit}))}</div>
   <div class="usage-line usage-remain">${esc(tf("usageRemaining",{n:quota.remaining}))}</div>
   ${quota.resetAt?`<div class="usage-line">${esc(tf("usageReset",{time:fmtReset(quota.resetAt)}))}</div>`:""}
   <div class="usage-note">${esc(t("usageNote"))}</div>`;
}
function applyLimitState(){
  const limited=isLimited(),composer=$("#composer"),card=$("#limit-card");
  composer.classList.toggle("is-limited",limited);
  promptEl.placeholder=limited?tf("limitPlaceholder",{time:fmtResetShort(quota.resetAt)}):t("placeholder");
  updateSend();
  if(limited){if(quota.dismissedFor!==String(quota.resetAt?.getTime()))renderLimitCard();else card.hidden=true;startLimitTick()}
  else{card.hidden=true;stopLimitTick()}
}
function renderLimitCard(){
  const card=$("#limit-card");
  const left=quota.resetAt?quota.resetAt.getTime()-Date.now():0;
  card.innerHTML=`<span class="limit-icon" aria-hidden="true">${I.clock}</span><div class="limit-text"><b>${esc(t("limitTitle"))}</b>
   <p>${esc(tf("limitBody",{limit:quota.limit}))} ${quota.resetAt?esc(tf("limitReset",{time:fmtReset(quota.resetAt)})):""} ${esc(t("limitBack"))}</p>
   ${quota.resetAt?`<span class="limit-countdown" id="limit-countdown">${esc(tf("usageResetIn",{d:fmtCountdown(left)}))}</span>`:""}</div>
   <button type="button" class="icon-btn" id="limit-dismiss" aria-label="${esc(t("dismiss"))}" title="${esc(t("dismiss"))}">${I.close}</button>`;
  card.hidden=false;
  $("#limit-dismiss").onclick=()=>{quota.dismissedFor=String(quota.resetAt?.getTime());try{sessionStorage.setItem("wormgpt-limit-dismissed",quota.dismissedFor)}catch{}card.hidden=true};
}
function showLimitCard(force){if(force){quota.dismissedFor=null;try{sessionStorage.removeItem("wormgpt-limit-dismissed")}catch{}}renderUsage()}
function startLimitTick(){
  if(quota.tick)return;
  quota.tick=setInterval(()=>{
    if(quota.resetAt&&Date.now()>=quota.resetAt.getTime()){refreshUsage();return}
    const c=$("#limit-countdown");if(c&&quota.resetAt)c.textContent=tf("usageResetIn",{d:fmtCountdown(quota.resetAt.getTime()-Date.now())});
  },30000);
}
function stopLimitTick(){clearInterval(quota.tick);quota.tick=0}
function maybeRefreshUsage(){if(quota.offline||quota.inflight)return;if(Date.now()-quota.fetchedAt>60000||(quota.resetAt&&Date.now()>=quota.resetAt.getTime()))refreshUsage()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")maybeRefreshUsage()});
addEventListener("focus",maybeRefreshUsage);
addEventListener("online",()=>refreshUsage());
